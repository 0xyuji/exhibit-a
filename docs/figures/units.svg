<text x="368.0" y="60.0" fill="#ece7de" font-size="11" font-weight="500" text-anchor="start">Official volume: $200</text>
<text x="368.0" y="77.0" fill="#9a968e" font-size="9.5" font-weight="400" text-anchor="start">BTC +$100 and USDT +$100, a sum of volume per token</text>
