<text x="368.0" y="118.0" fill="#ece7de" font-size="11" font-weight="500" text-anchor="start">Swap value, as used in this paper: $100</text>
<text x="368.0" y="135.0" fill="#9a968e" font-size="9.5" font-weight="400" text-anchor="start">each swap once, so the official figure is halved</text>
