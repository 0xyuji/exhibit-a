<line x1="257.0" y1="96.0" x2="351.0" y2="122.0" stroke="#c8a46a" stroke-opacity="0.8" marker-end="url(#tip)"/>
<text x="24.0" y="172.0" fill="#9a968e" font-size="10" font-weight="400" text-anchor="start">In this window: official volume $3.77B, swap value $1.89B, of which partner swaps $1.07B.</text>
