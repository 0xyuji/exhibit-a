<defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0.6 L7.2 4 L0 7.4 Z" fill="#c8a46a"/></marker></defs>
<text x="24.0" y="26.0" fill="#c8a46a" font-size="9.5" font-weight="500" text-anchor="start">ONE SWAP, TWO WAYS TO COUNT IT</text>
<rect x="24.0" y="46.0" width="230.0" height="74.0" rx="9" fill="#121316" stroke="#c8a46a" stroke-opacity="0.55"/>
<text x="36.0" y="66.0" fill="#ece7de" font-size="11" font-weight="500" text-anchor="start">One swap</text>
<text x="36.0" y="83.0" fill="#9a968e" font-size="9.5" font-weight="400" text-anchor="start">$100 of BTC goes in</text>
<text x="36.0" y="96.0" fill="#9a968e" font-size="9.5" font-weight="400" text-anchor="start">$100 of USDT comes out</text>
